<script>
/* Catch-all redirects for old or mistyped addresses. Keeps ?utm_ tags.
   Add a rule: [pattern, "/new-page/"]. First match wins. */
(function () {
  var rules = [
    [/^\/howiwork$|how-?it-?works?$/, "/howitworks/"],
    [/war.*sign|warning|quiz|health-?check|it-?test/, "/warning-signs/"],
    [/^\/a\d/, "/howitworks/"],
    [/^\/c\d/, "/results/"],
    [/reality-?check/, "/howitworks/"],
    [/result|case-?stor/, "/results/"],
    [/about/, "/about/"],
    [/contact|talk|book/, "/contact/"],
    [/resource|library|article/, "/"]
  ];
  var p;
  try { p = decodeURIComponent(location.pathname); } catch (e) { p = location.pathname; }
  p = p.toLowerCase().replace(/\/+$/, "");
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0].test(p)) {
      var to = rules[i][1];
      if (to.replace(/\/$/, "") !== p) { location.replace(to + location.search + location.hash); return; }
    }
  }
})();
</script>
